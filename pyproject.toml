[project]
name = "mitunet"
version = "0.2.0"
description = "Hybrid Mix-Transformer + U-Net wall segmentation for floor plans (modern Python/PyTorch reimplementation)"
readme = "README.md"
authors = [
    { name = "Lami", email = "154405627+Lqm1@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "albumentations>=2.0.8",
    "numpy>=2.0.2",
    "onnx>=1.22.0",
    "onnxruntime>=1.22.0",
    "onnxscript>=0.7.2",
    "opencv-python>=4.10.0.84",
    "pillow>=12.0.0",
    "pycocotools>=2.0.10",
    "pyyaml>=6.0.3",
    "rich>=14.0.0",
    "segmentation-models-pytorch>=0.5.0",
    "tensorboard>=2.21.0",
    "timm>=1.0.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "typer>=0.19.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
]
cu132 = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
]

[project.scripts]
mitunet = "mitunet.command:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu132" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C90", "N"]
ignore = ["E501", "B008", "N812", "C901"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
